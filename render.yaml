services:
  - type: web
    name: neuralwiki-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    region: oregon
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: CHAT_API_KEY
        sync: false
      - key: CHAT_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: CHAT_MODEL
        value: nvidia/llama-3.1-nemotron-nano-8b-v1
      - key: CHAT_API_KEY_FALLBACK
        sync: false
      - key: CHAT_API_BASE_URL_FALLBACK
        value: https://integrate.api.nvidia.com/v1
      - key: CHAT_MODEL_FALLBACK
        value: nvidia/llama-3.1-nemotron-nano-8b-v1
      - key: WIKI_API_KEY
        sync: false
      - key: WIKI_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: WIKI_MODEL
        value: mixtral-8x7b-32768
      - key: EXTRACT_API_KEY
        sync: false
      - key: EXTRACT_API_BASE_URL
        value: https://api.mistral.ai/v1
      - key: EXTRACT_MODEL
        value: mistral-small-latest
      - key: EXTRACT_API_KEY_FALLBACK
        sync: false
      - key: EXTRACT_API_BASE_URL_FALLBACK
        value: https://integrate.api.nvidia.com/v1
      - key: EXTRACT_MODEL_FALLBACK
        value: nvidia/llama-3.1-nemotron-nano-8b-v1
      - key: FRONTEND_URL
        fromService:
          name: neuralwiki-frontend
          property: url

  - type: static_site
    name: neuralwiki-frontend
    staticPublishPath: ./dist
    buildCommand: npm install && npm run build
    rootDir: ./frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: neuralwiki-backend
          property: url
